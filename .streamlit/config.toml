[theme]
base = "dark"
primaryColor = "#00D4FF"
backgroundColor = "#0A0E27"
secondaryBackgroundColor = "#141938"
textColor = "#E4E8F1"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = true
runOnSave = true
fileWatcherType = "auto"

[client]
showErrorDetails = false
toolbarMode = "minimal"

[runner]
fastReruns = true
enforceSerializableSessionState = false